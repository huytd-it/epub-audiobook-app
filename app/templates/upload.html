{% extends "base.html" %}
{% block title %}Tải lên EPUB{% endblock %}
{% block content %}
<h2>Tải lên EPUB</h2>

<div class="card">
    <form data-guard action="/books/upload" method="post" enctype="multipart/form-data" id="upload-form">
        <div class="form-group">
            <label for="epub_file">File EPUB <span class="required">*</span></label>
            <div class="dropzone" id="dropzone-epub">
                <div class="dropzone-icon">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
                </div>
                <div class="dropzone-text">Kéo thả file .epub vào đây hoặc bấm để chọn</div>
                <div class="dropzone-hint">Chỉ chấp nhận file .epub</div>
                <input type="file" id="epub_file" name="epub_file" accept=".epub" required>
            </div>
            <div id="epub-preview" class="img-preview" style="display:none"></div>
        </div>

        <p class="form-hint" style="color:var(--text-muted);font-size:var(--font-size-sm);margin:-0.5rem 0 var(--space-lg)">
            Upload chỉ nhập EPUB và các chapter. Patch được cấu hình và tạo sau trong trang chi tiết sách.
        </p>

        <button type="submit" class="btn-primary" style="margin-top:var(--space-md)" id="btn-submit">Tải lên EPUB</button>
    </form>
</div>

<script>
function setupEpubDropzone() {
    const dz = document.getElementById('dropzone-epub');
    const input = document.getElementById('epub_file');
    const preview = document.getElementById('epub-preview');
    if (!dz || !input) return;

    ['dragenter','dragover'].forEach(e => dz.addEventListener(e, ev => { ev.preventDefault(); dz.classList.add('dragover'); }));
    ['dragleave','drop'].forEach(e => dz.addEventListener(e, ev => { ev.preventDefault(); dz.classList.remove('dragover'); }));

    dz.addEventListener('drop', ev => {
        const files = ev.dataTransfer.files;
        if (files.length) { input.files = files; input.dispatchEvent(new Event('change')); }
    });

    input.addEventListener('change', function() {
        if (!this.files.length) return;
        const file = this.files[0];
        preview.innerHTML = '<span style="font-size:var(--font-size-sm);color:var(--text-secondary)">' + file.name + '</span>';
        preview.style.display = 'inline-block';
    });
}

setupEpubDropzone();
</script>
{% endblock %}
