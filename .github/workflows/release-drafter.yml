name: Release Drafter

# Tự động cập nhật draft release mỗi khi push lên main
# Draft này sẽ được dùng để preview notes trước khi tạo tag
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  drafter:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter@v6
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
