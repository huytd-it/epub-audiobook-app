[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "epub-audiobook-app"
version = "0.1.0"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "soundfile>=0.12",
    "numpy>=1.26",
    "pydantic-settings>=2.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth-httplib2>=0.2.0",
    "num2words>=0.5.13",
    "vietnormalizer>=0.2.3",
    "pillow>=10.0.0",
    "requests>=2.31",
]

[project.optional-dependencies]
tts = [
    "voxcpm",
]
omnivoice = [
    "omnivoice",
]
vieneu-fast = [
    "vieneu",
]
all-tts = [
    "voxcpm",
    "omnivoice",
    "vieneu",
]
light-tts = [
    "edge-tts>=7.0",
    "gTTS>=2.5",
    "piper-tts>=1.2",
]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
]

[tool.setuptools]
packages = ["app", "app.jobqueue", "app.jobqueue.handlers"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
